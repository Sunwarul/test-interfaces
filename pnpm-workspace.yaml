# pnpm v11 syntax: explicit build-script decisions (false = reviewed, do not run).
# Replaces the pre-v11 ignoredBuiltDependencies list; without an explicit
# decision per package, pnpm v11 exits 1 (ERR_PNPM_IGNORED_BUILDS) on install.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  msw: false
  sharp: false
  unrs-resolver: false
